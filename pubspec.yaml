name: agranova
description: A comprehensive cross-platform farmer community app for digital agricultural collaboration, real-time messaging, and AI-powered expert support.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.13.0
  cloud_firestore: ^4.13.0
  firebase_storage: ^11.5.0
  firebase_messaging: ^14.7.0

  # State Management
  provider: ^6.0.0
  
  # Localization
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  
  # UI/UX
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.7
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  
  # Navigation
  go_router: ^12.0.0
  
  # Image Handling
  image_picker: ^1.0.4
  video_player: ^2.8.1
  
  # Messaging
  intl_phone_number_input: ^0.7.2
  
  # Real-time Chat
  stream_chat_flutter: ^6.7.0
  
  # AI Integration
  google_generative_ai: ^0.3.0
  
  # In-App Purchases
  in_app_purchase: ^3.1.5
  
  # HTTP
  http: ^1.1.0
  
  # Utility
  shared_preferences: ^2.2.2
  uuid: ^3.0.7
  timeago: ^3.5.0
  geolocator: ^9.0.2
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
